<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Details - CodeMaster</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fas fa-code"></i> CodeMaster</a>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Submission Details</h5>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <strong>Problem:</strong> {{ submission.problem.title }}
                            </div>
                            <div class="col-md-6">
                                <strong>Status:</strong> 
                                <span class="badge 
                                    {% if submission.status == 'accepted' %}bg-success
                                    {% elif submission.status == 'wrong_answer' %}bg-danger
                                    {% else %}bg-warning{% endif %}">
                                    {{ submission.get_status_display }}
                                </span>
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <strong>Language:</strong> {{ submission.get_language_display }}
                            </div>
                            <div class="col-md-6">
                                <strong>Submitted:</strong> {{ submission.submitted_at }}
                            </div>
                        </div>
                        
                        <h6>Code:</h6>
                        <pre class="bg-light p-3 rounded"><code>{{ submission.code }}</code></pre>
                        
                        <div class="mt-3">
                            <a href="/submissions/" class="btn btn-secondary">Back to Submissions</a>
                            <a href="/problems/{{ submission.problem.slug }}/" class="btn btn-primary">View Problem</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
